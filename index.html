<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WessPic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="top-bar">
        <div class="top-left-section">
            <div class="logo">
                <img src="img/icons/wesspic.svg" alt="WessPic">
                <span>WessPic</span>
            </div>
            <nav class="top-menu">
                <div class="menu-item">
                    <button class="menu-btn" id="menu-file-btn">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        Archivo
                    </button>
                    <div class="dropdown-content hidden" id="dropdown-file">
                        <button id="btn-open">Abrir imagen</button>
                        <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg, image/webp" hidden>
                        <button id="btn-new">Cerrar imagen actual</button>
                        <div class="divider-horizontal"></div>
                        <button id="btn-save">Guardar imagen (exportar)</button>
                    </div>
                </div>
                <div class="menu-item">
                    <button class="menu-btn" id="menu-edit-btn">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        Edición
                    </button>
                </div>
                <div class="menu-item">
                    <button class="menu-btn" id="menu-image-btn">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        Imagen
                    </button>
                </div>
            </nav>
        </div>
        
        <div class="top-actions">
            <!-- Undo/Redo icons -->
            <button id="btn-undo" title="Deshacer" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
            </button>
            <button id="btn-redo" title="Rehacer" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"/></svg>
            </button>
        </div>
    </header>

    <main class="workspace" id="workspace">
        <div id="canvas-container">
            <canvas id="main-canvas"></canvas>
            <canvas id="ui-canvas"></canvas>
        </div>
        <div id="empty-state" class="empty-state">
            <p>Abre o arrastra una imagen para comenzar</p>
        </div>
        <div id="toast-container"></div>
    </main>

    <!-- Left Floating Pill (All Tools) -->
    <aside class="sidebar-left floating-pill">
        <button class="tool-btn" data-tool="selection" title="Selección (CTRL para editar)">
            <img src="img/icons/selection.svg" alt="Selección">
        </button>
        <button class="tool-btn active" data-tool="move" title="Mover">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v4"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V3a2 2 0 0 0-4 0v9"/><path d="M6 12v-1a2 2 0 0 0-4 0v5.5c0 3 2.5 6.5 7 6.5h3c3.5 0 6-3 6-7v-3.5a2 2 0 0 0-4 0V11"/></svg>
        </button>
        <button class="tool-btn" data-tool="adjust" title="Ajustar">
            <img src="img/icons/adjust.svg" alt="Ajustar">
        </button>
        <button class="tool-btn" data-tool="crop" title="Recortar">
            <img src="img/icons/trim.svg" alt="Recortar">
        </button>
    </aside>

    <!-- Floating Option Panels (Right) -->
    <div class="panels-container">
        <!-- Tools Properties Container -->
        <div class="tool-properties-wrapper">
            <!-- Adjustments Panel -->
            <div id="panel-adjust" class="tool-panel floating-panel hidden">
                <div class="panel-resizer"></div>
                <div class="sliders-list">
                    <div class="control-group">
                        <label>Brillo</label>
                        <input type="range" data-adjust="brightness" min="-100" max="100" value="0">
                    </div>
                    <div class="control-group">
                        <label>Contraste</label>
                        <input type="range" data-adjust="contrast" min="-100" max="100" value="0">
                    </div>
                    <div class="control-group">
                        <label>Saturación</label>
                        <input type="range" data-adjust="saturation" min="-100" max="100" value="0">
                    </div>
                    <div class="control-group">
                        <label>Sombras</label>
                        <input type="range" data-adjust="shadows" min="-100" max="100" value="0">
                    </div>
                    <div class="control-group">
                        <label>Blancos</label>
                        <input type="range" data-adjust="highlights" min="-100" max="100" value="0">
                    </div>
                    <div class="control-group">
                        <label>Temperatura</label>
                        <input type="range" data-adjust="temperature" min="-100" max="100" value="0">
                    </div>
                </div>
                <div class="panel-actions">
                    <button id="btn-reset-adjustments" class="btn-secondary">Restablecer</button>
                    <button id="btn-apply-adjustments" class="btn-primary">Aplicar</button>
                </div>
            </div>
            
            <!-- Crop Panel -->
            <div id="panel-crop" class="tool-panel floating-panel hidden">
                <div class="panel-actions center">
                    <button id="btn-apply-crop" class="btn-primary">Aplicar Recorte</button>
                </div>
            </div>
        </div>

        <!-- Layers Panel -->
        <div id="layers-panel" class="floating-panel layers-panel">
            <div class="layers-header">
                <span>CAPAS</span>
                <button id="btn-add-layer" title="Nueva Capa">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
            <div class="layers-list-container" id="layers-list">
                <!-- Layers injected by JS -->
            </div>
            <div class="layers-controls">
                <div class="layer-control-row">
                    <select id="layer-blend-mode" class="blend-select">
                        <option value="source-over">Normal</option>
                        <option value="multiply">Multiply</option>
                        <option value="screen">Screen</option>
                        <option value="overlay">Overlay</option>
                        <option value="darken">Darken</option>
                        <option value="lighten">Lighten</option>
                        <option value="difference">Difference</option>
                    </select>
                    <div class="opacity-control">
                        <span style="font-size: 10px; color: var(--text-sec);">OPC</span>
                        <input type="range" id="layer-opacity" min="0" max="100" value="100">
                    </div>
                </div>
                <div class="layer-control-row actions">
                    <button id="btn-layer-up" title="Subir"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="18 15 12 9 6 15"></polyline></svg></button>
                    <button id="btn-layer-down" title="Bajar"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                    <button id="btn-layer-duplicate" title="Duplicar"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
                    <button id="btn-layer-delete" title="Eliminar"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Status Bar -->
    <footer class="bottom-bar">
        <div class="bottom-bar-left">
            <button id="btn-select-all" class="icon-text-btn">Seleccionar Todo</button>
            <div class="divider-vertical"></div>
            <button id="btn-clear-selection" class="icon-text-btn">Deseleccionar</button>
        </div>
        <div class="bottom-bar-right">
            <button id="btn-reset-view" class="icon-text-btn">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                Centrar Vista
            </button>
        </div>
    </footer>

    <script src="js/state.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/history.js"></script>
    <script src="js/image.js"></script>
    <script src="js/adjustments.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/selection.js"></script>
    <script src="js/crop.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
